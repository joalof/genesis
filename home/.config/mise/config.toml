[settings]
# Only resolve fuzzy versions older than this (bypassed by pins/lock)
minimum_release_age = "4d"
# Respect rust-toolchain.toml / .nvmrc in projects
idiomatic_version_file_enable_tools = ["rust", "node"]
activate_shims = false

[tools]
# Prefer native package managers  over aqua where available.

# --- Runtimes & toolchains
node = "lts"
go = "latest"
# rust-analyzer ships as a rustup component so it always matches the toolchain
# mise sets up rustup without a default toolchain, which breaks cargo: tools
# installed in the same run
rust = { version = "stable", components = ["rust-analyzer", "rust-src", "clippy", "rustfmt"], postinstall = "rustup default stable" }
uv = "latest"  # aqua: needed to bootstrap the pypi: backend; uv provisions Python
zig = "0.15.2"
"npm:typescript" = "latest"

# --- Editor
neovim = "path:/home/joakim/apps/neovim"   # self-compiled, see genesis/mise-tasks/build-neovim
"cargo:tree-sitter-cli" = { version = "latest", locked = true }

# --- Language servers
"npm:typescript-language-server" = "latest"
"pypi:ty" = "latest"

# --- Linters & formatters
"pypi:ruff" = "latest"
"pypi:black" = "latest"

# --- Debug adapters (DAP)
"pypi:debugpy" = "latest"

# --- Coding agents
"npm:backlog.md" = "latest"

# --- Data & notebooks
"pypi:dvc" = "latest"
"pypi:jupytext" = "latest"
"cargo:xan" = { version = "latest", locked = true }

# --- Cloud
gcloud = "latest"

# --- CLI utilities
"cargo:fd-find" = { version = "latest", locked = true }
"cargo:eza" = { version = "latest", locked = true }
"cargo:zoxide" = { version = "latest", locked = true }
"cargo:tealdeer" = { version = "latest", locked = true }  # tldr
"go:github.com/junegunn/fzf" = "latest"
yazi = { version = "latest", postinstall = "ya pkg install" }
"cargo:starship" = { version = "latest", locked = true }
"go:github.com/jesseduffield/lazydocker" = "latest"

# --- Keyboard remapping
# note: need bootstrap scripts/kanata-setup.sh to work
"cargo:https://github.com/jtroo/kanata" = { version = "tag:v1.12.0", crate = "kanata", locked = true }
