[settings]
# Only resolve fuzzy versions older than this (bypassed by pins/lock)
minimum_release_age = "3d"
# Respect rust-toolchain.toml / .nvmrc in projects
idiomatic_version_file_enable_tools = ["rust", "node"]

[tools]
# Prefer native package managers  over aqua where available.

# --- Runtimes & toolchains
node = "lts"
go = "latest"
# rust-analyzer ships as a rustup component so it always matches the toolchain
rust = { version = "stable", components = ["rust-analyzer", "rust-src", "clippy", "rustfmt"] }
uv = "latest"  # aqua: needed to bootstrap the pypi: backend; uv provisions Python
zig = "0.15.2"
"npm:pnpm" = "latest"

# --- Editor
neovim = "path:/home/joakim/apps/neovim"   # self-compiled, see genesis/mise-tasks/build-neovim
"cargo:tree-sitter-cli" = { version = "latest", locked = true }

# --- Language servers
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"  # required by typescript-language-server
"go:golang.org/x/tools/gopls" = "latest"
"pypi:ty" = "latest" # Python type checker + LSP

# --- Linters & formatters
"pypi:ruff" = "latest"
"pypi:black" = "latest"

# --- Debug adapters (DAP)
"pypi:debugpy" = "latest"

# --- Coding agents
"npm:backlog.md" = "latest"

# --- Data & notebooks
"pypi:dvc" = "latest"
"pypi:jupytext" = "latest"
"cargo:xan" = { version = "latest", locked = true }

# --- Cloud
gcloud = "latest"

# --- CLI utilities
"cargo:fd-find" = { version = "latest", locked = true }
"cargo:eza" = { version = "latest", locked = true }
"cargo:zoxide" = { version = "latest", locked = true }
"cargo:tealdeer" = { version = "latest", locked = true }  # tldr
"go:github.com/junegunn/fzf" = "latest"
# aqua: yazi's crates refuse plain `cargo install`, and yazi-build installs outside mise
yazi = { version = "latest", postinstall = "ya pkg install" }  # plugins from ~/.config/yazi/package.toml
"cargo:starship" = { version = "latest", locked = true }
"go:github.com/jesseduffield/lazydocker" = "latest"

# --- Keyboard remapping
# 1.12 isn't on crates.io, so build the tag from git
"cargo:https://github.com/jtroo/kanata" = { version = "tag:v1.12.0", crate = "kanata", locked = true, postinstall = "bash ~/code/genesis/scripts/kanata-setup.sh" }
